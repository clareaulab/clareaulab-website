<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
<script src="./site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: #eef4f9; font-family: 'Hanken Grotesk', system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: #0f2a3f; }
  a { text-decoration: none; color: inherit; }
  .hero-cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</helmet>

<div style="width: 100%; overflow-x: hidden;">

  <!-- ============ TOOLBAR (solid; animation never touches it) ============ -->
  <div style="background: #060b16; border-bottom: 1px solid rgba(127,214,255,.12);">
    <div style="max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 24px 40px;">
      <img src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto; filter: brightness(0) invert(1);">
      <nav style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #bcd6ea; padding: 9px 15px; border: 1px solid rgba(127,214,255,.18); border-radius: 999px;">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- ============ HERO ============ -->
  <section style="position: relative; min-height: clamp(560px, 80vh, 820px); background: linear-gradient(180deg, #060b16 0%, #081326 60%, #0a1830 100%); overflow: hidden;">

    <canvas id="hero-anim" class="hero-cv"></canvas>

    <!-- readability scrim -->
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,11,22,.9) 0%, rgba(6,11,22,.6) 28%, rgba(6,11,22,.2) 55%, rgba(6,11,22,0) 78%); pointer-events: none;"></div>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(10,24,48,0), #0a1830); pointer-events: none;"></div>

    <!-- eyebrow, pinned just under the toolbar -->
    <div style="position: relative; z-index: 3; max-width: 1200px; margin: 0 auto; padding: 26px 40px 0;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: #4fd8ff;">Computational &amp; Systems Immunology &middot; MSK</span>
    </div>
  </section>

  <!-- ============ CONTENT ============ -->
  <div style="max-width: 1200px; margin: 0 auto; padding: 0 40px;">

    <!-- news teasers -->
    <div style="padding: 64px 0 12px; display: flex; align-items: baseline; justify-content: space-between;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">Recent news</span>
      <a href="News.dc.html" style="font-family: 'Space Mono', monospace; font-size: 12px; color: #24425c;">all news &rarr;</a>
    </div>
    <div style="padding: 6px 0 56px;">
      <sc-for list="{{ teasers }}" as="item" hint-placeholder-count="3">
        <a href="News.dc.html" style="display: grid; grid-template-columns: 130px 1fr; gap: 20px; align-items: baseline; padding: 18px 0; border-top: 1px solid rgba(57,99,175,.14);">
          <span style="font-family: 'Space Mono', monospace; font-size: 13px; color: #6a8296;">{{ item.date }}</span>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 19px; font-weight: 400; color: #16324a;">{{ item.title }}</span>
        </a>
      </sc-for>
    </div>
  </div>

  <!-- photo reel -->
  <div style="max-width: 1200px; margin: 0 auto; padding: 8px 40px 14px;">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">Life in the lab &middot; New York City</span>
  </div>
  <div style="overflow: hidden; padding: 6px 0 64px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent); mask-image: linear-gradient(90deg, transparent, #000 6%, #000 94%, transparent);">
    <div style="display: flex; gap: 18px; width: max-content; animation: marquee 42s linear infinite; padding: 0 40px;">
      <sc-for list="{{ photos }}" as="item" hint-placeholder-count="3">
        <figure style="margin: 0; width: 420px; flex: 0 0 auto;">
          <img src="{{ item.src }}" alt="{{ item.cap }}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 18px; display: block;">
          <figcaption style="font-family: 'Space Mono', monospace; font-size: 12px; color: #5c7488; margin-top: 10px;">{{ item.cap }}</figcaption>
        </figure>
      </sc-for>
      <sc-for list="{{ photos }}" as="item" hint-placeholder-count="3">
        <figure style="margin: 0; width: 420px; flex: 0 0 auto;">
          <img src="{{ item.src }}" alt="{{ item.cap }}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 18px; display: block;">
          <figcaption style="font-family: 'Space Mono', monospace; font-size: 12px; color: #5c7488; margin-top: 10px;">{{ item.cap }}</figcaption>
        </figure>
      </sc-for>
    </div>
  </div>

  <!-- footer -->
  <div style="position: relative; background: #0a1830; color: #cfe6f2; padding: 48px 40px; overflow: hidden;">
    <div style="max-width: 1200px; margin: 0 auto; position: relative; display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; flex-wrap: wrap;">
      <div>
        <div style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 500; color: #eef6ff;">{{ footer.name }}</div>
        <div style="font-size: 14px; color: #8fb6cc; margin-top: 6px;">{{ footer.org }}</div>
      </div>
      <div style="font-family: 'Space Mono', monospace; font-size: 12px; color: #7fa7bf;">{{ footer.url }}</div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { teasers: [], photos: [] };

  componentWillUnmount() { this._stop = true; if (this._ro) this._ro.disconnect(); }

  async _loadContent() {
    try {
      const home = await window.SITE.loadYaml('content/home.yaml');
      this.setState({ teasers: home.teasers || [], photos: home.photos || [] });
    } catch (e) { console.error('Failed to load home content:', e); }
  }

  renderVals() {
    return {
      nav: window.SITE.nav,
      teasers: this.state.teasers,
      photos: this.state.photos,
      footer: window.SITE.footer,
    };
  }

  componentDidMount() {
    this._stop = false;
    this._loadContent();
    const bases = ['A', 'C', 'G', 'T'];
    const baseColor = { A: '#45e6c4', C: '#33d1f0', G: '#5f9dff', T: '#5fd6d8' };
    const bitColor = '#8ff2ff';
    const cellHue = [168, 182, 196, 158];
    const virusHue = [188, 200, 206];
    const glow = (ctx, c, b) => { ctx.shadowColor = c; ctx.shadowBlur = b; };
    const noGlow = (ctx) => { ctx.shadowBlur = 0; };
    const rnd = (a, b) => a + Math.random() * (b - a);
    const pick = (arr) => arr[(Math.random() * arr.length) | 0];

    const drawCell = (ctx, x, y, r, hue, t, a) => {
      ctx.save();
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${hue},85%,74%,${.4 * a})`);
      g.addColorStop(.7, `hsla(${hue},80%,62%,${.16 * a})`);
      g.addColorStop(1, `hsla(${hue},80%,58%,0)`);
      glow(ctx, `hsla(${hue},85%,68%,${.9 * a})`, 15);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      noGlow(ctx);
      ctx.strokeStyle = `hsla(${hue},85%,82%,${.7 * a})`; ctx.lineWidth = 1.3;
      ctx.beginPath(); ctx.arc(x, y, r * 0.84, 0, 6.2832); ctx.stroke();
      ctx.fillStyle = `hsla(${hue},75%,84%,${.5 * a})`;
      ctx.beginPath();
      ctx.arc(x + Math.sin(t * 0.02) * r * 0.12, y + Math.cos(t * 0.02) * r * 0.12, r * 0.3, 0, 6.2832);
      ctx.fill();
      ctx.restore();
    };

    const drawVirus = (ctx, x, y, r, hue, t, a) => {
      ctx.save();
      const spikes = 11;
      glow(ctx, `hsla(${hue},90%,64%,${.9 * a})`, 10);
      ctx.strokeStyle = `hsla(${hue},85%,74%,${.85 * a})`; ctx.lineWidth = 1.2;
      for (let k = 0; k < spikes; k++) {
        const ang = k / spikes * 6.2832 + t * 0.012;
        const x1 = x + Math.cos(ang) * r, y1 = y + Math.sin(ang) * r;
        const x2 = x + Math.cos(ang) * (r + 5), y2 = y + Math.sin(ang) * (r + 5);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
        ctx.fillStyle = `hsla(${hue},90%,78%,${.95 * a})`;
        ctx.beginPath(); ctx.arc(x2, y2, 1.8, 0, 6.2832); ctx.fill();
      }
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `hsla(${hue},90%,76%,${.95 * a})`);
      g.addColorStop(1, `hsla(${hue},85%,50%,${.55 * a})`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      ctx.restore();
    };

    const cv = document.getElementById('hero-anim');
    if (!cv) return;
    const ctx = cv.getContext('2d');
    let W = 0, H = 0, t = 0;
    let cells = [], baseP = [], bits = [];
    const cellEnd = 0.34, baseEnd = 0.68;
    const speed = () => rnd(0.7, 1.4) * (W / 1240 * 0.7 + 0.55);

    const spawnCell = (x) => {
      const isV = Math.random() < 0.34;
      cells.push({ x: x == null ? -rnd(0, 60) : x, uy: rnd(H * 0.1, H * 0.9), vy: rnd(-0.15, 0.15),
        r: Math.max(11, rnd(W * 0.010, W * 0.017)), hue: isV ? pick(virusHue) : pick(cellHue), type: isV ? 'v' : 'c',
        sp: speed(), a: 0, st: 'a', wob: rnd(0, 6.28), wf: rnd(0.008, 0.018), wa: H * 0.02 });
    };
    const spawnBase = (x, uy) => baseP.push({ x, uy, base: pick(bases), sp: speed() * rnd(0.95, 1.15), a: 0, div: false, wob: rnd(0, 6.28), wf: rnd(0.01, 0.02), wa: H * 0.02 });
    const spawnBit = (x, uy) => bits.push({ x, uy, bit: Math.random() < .5 ? '0' : '1', sp: speed() * rnd(1.0, 1.25), a: 0, wob: rnd(0, 6.28), wf: rnd(0.01, 0.025), wa: H * 0.02 });

    const resize = () => {
      const DPR = Math.min(2, window.devicePixelRatio || 1);
      W = cv.clientWidth; H = cv.clientHeight;
      if (!W || !H) return;
      cv.width = W * DPR; cv.height = H * DPR;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      cells = []; baseP = []; bits = [];
      const nc = Math.round((W / 1240) * 15) + 5;
      for (let i = 0; i < nc; i++) spawnCell(rnd(0, W * cellEnd));
      for (let i = 0; i < nc * 3; i++) spawnBase(rnd(W * cellEnd, W * baseEnd), rnd(H * 0.1, H * 0.9));
      for (let i = 0; i < nc * 5; i++) spawnBit(rnd(W * baseEnd, W), rnd(H * 0.1, H * 0.9));
    };

    const loop = () => {
      if (this._stop) return;
      if (!W) { requestAnimationFrame(loop); return; }
      t++;
      const fs = Math.max(12, W * 0.0125);
      ctx.fillStyle = 'rgba(6,11,22,0.30)'; ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      const cellTarget = Math.round((W / 1240) * 15) + 5;
      if (cells.length < cellTarget && Math.random() < 0.5) spawnCell(null);
      for (let i = cells.length - 1; i >= 0; i--) {
        const c = cells[i];
        c.x += c.sp; c.uy += c.vy; c.wob += c.wf;
        if (c.uy < H * 0.08 || c.uy > H * 0.92) c.vy *= -1;
        if (c.st === 'a') {
          c.a = Math.min(1, c.a + 0.05);
          if (c.x >= W * cellEnd) {
            c.st = 'd';
            const k = 3 + (Math.random() * 2 | 0);
            for (let j = 0; j < k; j++) spawnBase(c.x + rnd(-6, 6), c.uy + rnd(-H * 0.05, H * 0.05));
          }
        } else { c.a -= 0.07; c.r *= 0.965; }
        if (c.a <= 0) { cells.splice(i, 1); continue; }
        const y = c.uy + Math.sin(c.wob) * c.wa;
        c.type === 'v' ? drawVirus(ctx, c.x, y, c.r, c.hue, t, c.a) : drawCell(ctx, c.x, y, c.r, c.hue, t, c.a);
      }

      ctx.font = `700 ${fs}px "Space Mono", monospace`;
      for (let i = baseP.length - 1; i >= 0; i--) {
        const p = baseP[i];
        p.x += p.sp; p.wob += p.wf;
        if (!p.div && p.x >= W * baseEnd) {
          p.div = true;
          const m = 2 + (Math.random() < .5 ? 1 : 0);
          for (let j = 0; j < m; j++) spawnBit(p.x + rnd(-5, 5), p.uy + rnd(-H * 0.03, H * 0.03));
        }
        if (p.div) p.a -= 0.08; else p.a = Math.min(1, p.a + 0.06);
        if (p.a <= 0) { baseP.splice(i, 1); continue; }
        const c = baseColor[p.base];
        ctx.fillStyle = c; ctx.globalAlpha = p.a; glow(ctx, c, 9);
        ctx.fillText(p.base, p.x, p.uy + Math.sin(p.wob) * p.wa);
        ctx.globalAlpha = 1;
      }
      noGlow(ctx);

      ctx.font = `700 ${fs}px "Space Grotesk", system-ui, sans-serif`;
      for (let i = bits.length - 1; i >= 0; i--) {
        const p = bits[i];
        p.x += p.sp; p.wob += p.wf;
        const fadeOut = p.x > W * 0.9 ? Math.max(0, (W - p.x) / (W * 0.1)) : 1;
        p.a = Math.min(1, p.a + 0.08);
        if (p.x > W + 10) { bits.splice(i, 1); continue; }
        ctx.fillStyle = bitColor; ctx.globalAlpha = 0.85 * p.a * fadeOut; glow(ctx, bitColor, 8);
        ctx.fillText(p.bit, p.x, p.uy + Math.sin(p.wob) * p.wa);
        ctx.globalAlpha = 1;
      }
      noGlow(ctx);

      requestAnimationFrame(loop);
    };

    resize();
    this._ro = new ResizeObserver(() => resize());
    this._ro.observe(cv);
    loop();
  }
}
</script>
</body>
</html>
