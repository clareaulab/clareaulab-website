<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lareau Lab | News</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260725">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<script>(function(){try{var m=localStorage.getItem('lareau-theme')||'auto';var d=m==='dark'||(m==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.setAttribute('data-theme',d?'dark':'light');r.setAttribute('data-theme-mode',m);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<script src="./support.js"></script>
<script src="./site.js?v=20260707"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20260707">
<script src="./backsplash-engine.js?v=20260726"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
  /* On phones the wide illustration crops too tightly — shorten the hero so
     more of it shows (less zoomed in). */
  @media (max-width: 640px) {
    .hero-inner { min-height: 190px !important; }
  }
</style>
</helmet>

<div style="min-height: 100vh;">

  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: var(--nav-bg); border-bottom: 1px solid var(--line);">
    <div class="nav-inner" style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px;">
      <a href="./"><img class="site-logo" src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto;"></a>
      <label class="nav-toggle" aria-label="Toggle menu"><input type="checkbox" class="nav-toggle-cb"></label>
      <nav class="nav-links">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="{{ item.style }}">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- hero: full-bleed banner with the page title overlaid -->
  <section style="position: relative; width: 100%; overflow: hidden; background: var(--page-bg-flat);">
    <canvas data-backsplash="news" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
    <div class="hero-inner" style="position: relative; max-width: 1120px; margin: 0 auto; min-height: clamp(380px, 56vh, 540px); display: flex; flex-direction: column; justify-content: center; padding: 32px;">
      <h1 class="page-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 400; line-height: 1.02; letter-spacing: -.02em; margin: 0;">News</h1>
    </div>
  </section>

  <!-- years -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 8px 32px 120px;">
    <sc-for list="{{ years }}" as="yr" hint-placeholder-count="4">
      <section class="news-grid" style="padding: 40px 0; border-top: 1px solid var(--line-3);">
        <div class="news-year" onClick="{{ yr.toggle }}" style="cursor: pointer; user-select: none;" title="Click to collapse / expand">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 42px; color: var(--ink); line-height: 1; display: flex; align-items: center; gap: 12px;">{{ yr.year }} <span style="font-size: 20px; color: var(--muted); font-weight: 400;">{{ yr.caret }}</span></div>
          <div style="font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted); margin-top: 8px;">{{ yr.count }}</div>
        </div>
        <sc-if value="{{ yr.open }}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <sc-for list="{{ yr.posts }}" as="p" hint-placeholder-count="6">
            <article style="background: var(--card); border: 1px solid var(--line-2); border-radius: 20px; padding: 24px 26px;">
              <div style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .06em; color: var(--accent); margin-bottom: 10px;">{{ p.date }}</div>
              <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 23px; line-height: 1.2; margin: 0 0 12px; color: var(--ink-2);">{{ p.title }}</h2>
              {{ p.body }}
            </article>
          </sc-for>
        </div>
        </sc-if>
      </section>
    </sc-for>
  </div>

  <!-- footer (shared component: site-footer.dc.html) -->
  <dc-import name="site-footer"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { posts: [], collapsed: {} };

  toggleYear(y) {
    const c = { ...this.state.collapsed };
    c[y] = !c[y];
    this.setState({ collapsed: c });
  }

  async componentDidMount() {
    try {
      const data = await window.SITE.loadYaml('content/news.yaml');
      this.setState({ posts: data || [] });
    } catch (e) { console.error('Failed to load news content:', e); }
  }

  renderVals() {
    const nav = window.SITE.navItems('news.html');
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const posts = (this.state.posts || []).map(item => {
      const d = item.date;
      const [y, m] = d.split('-');
      return {
        d, year: y, sortKey: d,
        date: months[parseInt(m, 10) - 1] + ' ' + y,
        title: item.title,
        body: React.createElement('div', {
          style: { fontSize: '16px', lineHeight: '1.6', color: 'var(--body)' },
          dangerouslySetInnerHTML: { __html: window.SITE.md(item.body) },
        }),
      };
    }).sort((a, b) => b.sortKey.localeCompare(a.sortKey));

    const byYear = {};
    posts.forEach(p => { (byYear[p.year] = byYear[p.year] || []).push(p); });
    const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a)).map(y => ({
      year: y,
      posts: byYear[y],
      count: byYear[y].length + (byYear[y].length === 1 ? ' update' : ' updates'),
      open: !this.state.collapsed[y],
      caret: this.state.collapsed[y] ? '▸' : '▾',
      toggle: () => this.toggleYear(y),
    }));

    return { nav, years };
  }
}
</script>
</body>
</html>
