<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lareau Lab | Research</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260725">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<script>(function(){try{var m=localStorage.getItem('lareau-theme')||'auto';var d=m==='dark'||(m==='auto'&&window.matchMedia('(prefers-color-scheme: dark)').matches);var r=document.documentElement;r.setAttribute('data-theme',d?'dark':'light');r.setAttribute('data-theme-mode',m);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<script src="./support.js"></script>
<script src="./site.js?v=20260707"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20260707">
<script src="./backsplash-engine.js?v=20260726"></script>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page-bg); font-family: 'Hanken Grotesk', system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
</style>
</helmet>

<div style="min-height: 100vh;">

  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: var(--nav-bg); border-bottom: 1px solid var(--line);">
    <div class="nav-inner" style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px;">
      <a href="./"><img class="site-logo" src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto;"></a>
      <label class="nav-toggle" aria-label="Toggle menu"><input type="checkbox" class="nav-toggle-cb"></label>
      <nav class="nav-links">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="{{ item.style }}">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- hero: full-bleed banner with the page title overlaid -->
  <section style="position: relative; width: 100%; overflow: hidden; background: var(--page-bg-flat);">
    <canvas data-backsplash="research" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block;"></canvas>
    <div class="research-hero-inner" style="position: relative; max-width: 1120px; margin: 0 auto; min-height: clamp(380px, 56vh, 540px); display: flex; flex-direction: column; justify-content: center; padding: 32px;">
      <h1 class="page-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 400; line-height: 1.02; letter-spacing: -.02em; margin: 0;">Research</h1>
    </div>
  </section>

  <!-- intro paragraphs -->
  <div style="max-width: 760px; margin: 0 auto; padding: 8px 32px 8px;">
    <sc-for list="{{ intro }}" as="para" hint-placeholder-count="3">
      <p style="font-size: 19px; line-height: 1.65; color: var(--body); margin: 0 0 20px;">{{ para }}</p>
    </sc-for>
  </div>

  <!-- funding & support -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 40px 32px 100px;">
    <div style="padding: 24px 0 8px;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent);">Funding &amp; support</span>
    </div>
    <p style="font-size: 16px; line-height: 1.55; color: var(--muted); max-width: 640px; margin: 4px 0 22px;">We are grateful to the agencies and foundations whose support makes our work possible.</p>
    <div class="funder-grid">
      <sc-for list="{{ funders }}" as="f" hint-placeholder-count="9">
        <div class="funder-cell" title="{{ f.name }}">
          <img src="{{ f.img }}" alt="{{ f.name }}" loading="lazy" decoding="async">
        </div>
      </sc-for>
    </div>
  </div>

  <!-- footer (shared component: site-footer.dc.html) -->
  <dc-import name="site-footer"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { intro: [], funders: [] };

  async componentDidMount() {
    try {
      const d = await window.SITE.loadYaml('content/research.yaml');
      this.setState({ intro: d.intro || [], funders: d.funders || [] });
    } catch (e) { console.error('Failed to load research content:', e); }
  }

  renderVals() {
    return {
      nav: window.SITE.navItems('research.html'),
      // render markdown (bold + the one link) as HTML inside each paragraph
      intro: (this.state.intro || []).map((s) =>
        React.createElement('span', { dangerouslySetInnerHTML: { __html: window.SITE.md(s) } })),
      funders: this.state.funders,
    };
  }
}
</script>
</body>
</html>
