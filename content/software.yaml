# =============================================================================
# Software page content.  Edit this file to add / remove / update tools.
#
# intro    — one or two short paragraphs at the top. Markdown links and
#            **bold** work.
#
# tools    — the main tool cards. Each has:
#   name:     Tool name as people type it (e.g. mgatk)
#   tagline:  A few words saying what it is
#   about:    One or two sentences (markdown links work)
#   lang:     Language label shown on the card (Python, R, Shell, ...)
#   tags:     (optional) short topic chips
#   install:  (optional) a one-line install command, shown in monospace
#   repo:     GitHub "owner/name" — becomes the Code button
#   docs:     (optional) documentation / website URL
#   doi:      (optional) the paper to cite — becomes the Paper button
#
# resources — reference data and probe-design utilities (same fields, all
#             optional except name/about/repo).
#
# reproducibility — repositories that reproduce a specific paper. Each has
#   paper: a short label, year: the year, repo: GitHub "owner/name",
#   doi: (optional) the paper.
# =============================================================================

intro:
  - Our lab has a long-standing commitment to developing and maintaining open-source tools that supports our work. Further, we organize and release all custom code underlying key analyses in our major works to enable others reproducing and extending our analyses. 
  - Please raise any questions and/or  bug reports as issue on the relevant GitHub repository.

tools:
  - name: mgatk
    tagline: Mitochondrial genome analysis toolkit
    about: Calls mtDNA variants and heteroplasmy from single-cell and bulk sequencing, including mtscATAC-seq, ASAP-seq, and DOGMA-seq, for clonal and lineage tracing in human cells.
    lang: Python
    tags: [mtDNA, lineage tracing]
    install: pip install mgatk
    repo: caleblareau/mgatk
    docs: https://caleblareau.github.io/mgatk
    doi: 10.1038/s41587-020-0645-6

  - name: giftwrap
    tagline: Genotyping in fixed transcriptomes
    about: The all-in-one pipeline for GIFT-seq data, genotyping targeted variants alongside gene expression in fixed single-cell libraries, without prior genotype information.
    lang: Python
    tags: [genotyping, single-cell]
    install: pip install giftwrap-sc
    repo: clareaulab/giftwrap
    docs: https://clareaulab.github.io/giftwrap
    doi: 10.64898/2026.04.11.717967

  - name: CARPNN
    tagline: Chimeric antigen receptor ProteinMPNN
    about: An HPC-ready protein design workflow for large-scale folding with Boltz, BindCraft-style binder filtering, and lead optimization of de novo binders for use in CARs.
    lang: Python
    tags: [protein design, CAR T]
    repo: clareaulab/CARPNN
    doi: 10.1038/s41551-026-01790-9

  - name: bap
    tagline: Bead-based single-cell ATAC processing
    about: Identifies and merges barcodes from beads that share a droplet in dscATAC-seq and related bead-based single-cell assays.
    lang: Python
    tags: [scATAC-seq, barcodes]
    repo: caleblareau/bap
    docs: https://caleblareau.github.io/bap
    doi: 10.1038/s41587-019-0147-6

resources:
  - name: Human anellovirus pangenome
    about: A curated, non-redundant reference of 2,023 human anellovirus genomes, masked for low-complexity repeats and paired with kallisto for quantification.
    lang: Reference
    repo: clareaulab/human_anellovirus_pangenome

  - name: GIFT probe design
    about: Designs custom gap-filling probes for 10x Genomics Flex and Visium HD, with optional BLAST off-target filtering.
    lang: Python
    repo: clareaulab/probeset_design_pipeline

  - name: mitoblacklist
    about: Masks nuclear regions with high homology to mtDNA, so that mtDNA-enriched assays don't produce spurious nuclear reads.
    lang: Shell
    repo: caleblareau/mitoblacklist

