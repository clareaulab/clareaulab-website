<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lareau Lab | Research</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<script src="./support.js"></script>
<script src="./site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #eafff5 0%, #e6f9ff 40%, #f4fbff 100%); font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #0f2a3f; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
</style>
</helmet>

<div style="min-height: 100vh;">

  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(244,251,255,.72); border-bottom: 1px solid rgba(57,99,175,.12);">
    <div class="nav-inner" style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px;">
      <a href="Home.dc.html"><img src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto;"></a>
      <label class="nav-toggle" aria-label="Toggle menu"><input type="checkbox" class="nav-toggle-cb"></label>
      <nav class="nav-links">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="{{ item.style }}">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- page header -->
  <div class="page-head" style="max-width: 1120px; margin: 0 auto; padding-bottom: 8px;">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #0091c7;">What we do</span>
    <h1 class="page-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 400; line-height: 1.02; letter-spacing: -.02em; margin: 18px 0 16px;">Research</h1>
  </div>

  <!-- intro paragraphs -->
  <div style="max-width: 760px; margin: 0 auto; padding: 8px 32px 8px;">
    <sc-for list="{{ intro }}" as="para" hint-placeholder-count="3">
      <p style="font-size: 19px; line-height: 1.65; color: #33566f; margin: 0 0 20px;">{{ para }}</p>
    </sc-for>
  </div>

  <!-- funding & support -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 40px 32px 100px;">
    <div style="padding: 24px 0 8px;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">Funding &amp; support</span>
    </div>
    <p style="font-size: 16px; line-height: 1.55; color: #6a8296; max-width: 640px; margin: 4px 0 22px;">We are grateful to the agencies and foundations whose support makes our work possible.</p>
    <div class="funder-grid">
      <sc-for list="{{ funders }}" as="f" hint-placeholder-count="9">
        <div class="funder-cell" title="{{ f.name }}">
          <img src="{{ f.img }}" alt="{{ f.name }}" loading="lazy" decoding="async">
        </div>
      </sc-for>
    </div>
  </div>

  <!-- footer (shared component: site-footer.dc.html) -->
  <dc-import name="site-footer"></dc-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { intro: [], funders: [] };

  async componentDidMount() {
    try {
      const d = await window.SITE.loadYaml('content/research.yaml');
      this.setState({ intro: d.intro || [], funders: d.funders || [] });
    } catch (e) { console.error('Failed to load research content:', e); }
  }

  renderVals() {
    return {
      nav: window.SITE.navItems('Research.dc.html'),
      intro: this.state.intro,
      funders: this.state.funders,
    };
  }
}
</script>
</body>
</html>
