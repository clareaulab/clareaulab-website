<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lareau Lab | Team</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260725">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<script src="./support.js"></script>
<script src="./site.js?v=20260707"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css?v=20260707">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #eafff5 0%, #e6f9ff 40%, #f4fbff 100%); font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #0f2a3f; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
</style>
</helmet>

<div style="min-height: 100vh;">

  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(244,251,255,.72); border-bottom: 1px solid rgba(57,99,175,.12);">
    <div class="nav-inner" style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px;">
      <a href="./"><img src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto;"></a>
      <label class="nav-toggle" aria-label="Toggle menu"><input type="checkbox" class="nav-toggle-cb"></label>
      <nav class="nav-links">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="{{ item.style }}">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- hero: full-bleed splash (hand-drawn lab illustration) with the title overlaid -->
  <section style="position: relative; width: 100%; overflow: hidden; background: linear-gradient(180deg, #eafff5 0%, #e6f9ff 100%);">
    <img src="assets/banners/team-splash.png" alt="Hand-drawn illustration of the Lareau Lab members waving" decoding="async"
         style="position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom;">
    <div style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(234,255,245,.95) 0%, rgba(234,255,245,.72) 30%, rgba(234,255,245,.25) 58%, rgba(234,255,245,0) 82%);"></div>
    <div style="position: relative; max-width: 1120px; margin: 0 auto; min-height: clamp(320px, 46vh, 480px); display: flex; flex-direction: column; justify-content: center; padding: 32px;">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #0091c7;">The people</span>
      <h1 class="page-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 400; line-height: 1.02; letter-spacing: -.02em; margin: 16px 0 0;">Team</h1>
    </div>
  </section>

  <!-- role groups: Lab + Co-mentored only -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 24px 32px 12px;">
    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <div onClick="{{ g.toggle }}" style="padding: 24px 0 8px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 10px;" title="Click to collapse / expand">
        <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">{{ g.label }}</span>
        <span style="font-size: 12px; color: #6a8296;">{{ g.caret }}</span>
      </div>
      <sc-if value="{{ g.open }}" hint-placeholder-val="{{ true }}">
      <div class="people-grid" style="padding: 8px 0 20px;">
        <sc-for list="{{ g.members }}" as="m" hint-placeholder-count="4">
          <button onClick="{{ m.onClick }}" type="button" style="text-align: left; font: inherit; color: inherit; cursor: pointer; background: rgba(255,255,255,.6); border: 1px solid rgba(57,99,175,.14); border-radius: 20px; padding: 14px 14px 18px;" style-hover="border: 1px solid rgba(0,145,199,.55); box-shadow: 0 16px 34px -24px rgba(20,50,80,.7); transform: translateY(-2px);">
            <img src="{{ m.img }}" alt="{{ m.name }}" loading="lazy" decoding="async" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 14px; display: block; margin-bottom: 14px;">
            <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 18px; color: #16324a;">{{ m.name }}</div>
            <div style="font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #6a8296; margin-top: 4px;">{{ m.role }}</div>
          </button>
        </sc-for>
      </div>
      </sc-if>
    </sc-for>
  </div>

  <!-- Technical Support (pets) — smaller cards & font -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 20px 32px 12px;">
    <div onClick="{{ petsToggle }}" style="padding: 24px 0 4px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 10px;" title="Click to collapse / expand">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">Technical support</span>
      <span style="font-size: 12px; color: #6a8296;">{{ petsCaret }}</span>
    </div>
    <sc-if value="{{ petsOpen }}" hint-placeholder-val="{{ false }}">
    <div class="pets-grid" style="padding: 10px 0 20px;">
      <sc-for list="{{ pets }}" as="p" hint-placeholder-count="8">
        <div style="background: rgba(255,255,255,.5); border: 1px solid rgba(57,99,175,.12); border-radius: 14px; padding: 8px 8px 10px;">
          <img src="{{ p.img }}" alt="{{ p.name }}" loading="lazy" decoding="async" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 10px; display: block; margin-bottom: 8px;">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 13px; color: #33566f;">{{ p.name }}</div>
        </div>
      </sc-for>
    </div>
    </sc-if>
  </div>

  <!-- alumni -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 24px 32px 100px;">
    <div onClick="{{ alumniToggle }}" style="padding: 24px 0 8px; cursor: pointer; user-select: none; display: flex; align-items: center; gap: 10px;" title="Click to collapse / expand">
      <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #0091c7;">Alumni</span>
      <span style="font-size: 12px; color: #6a8296;">{{ alumniCaret }}</span>
    </div>
    <sc-if value="{{ alumniOpen }}" hint-placeholder-val="{{ false }}">
    <div class="people-grid" style="padding: 8px 0;">
      <sc-for list="{{ alumni }}" as="m" hint-placeholder-count="7">
        <button onClick="{{ m.onClick }}" type="button" style="text-align: left; font: inherit; color: inherit; cursor: pointer; background: rgba(255,255,255,.6); border: 1px solid rgba(57,99,175,.14); border-radius: 20px; padding: 14px 14px 18px;" style-hover="border: 1px solid rgba(0,145,199,.55); box-shadow: 0 16px 34px -24px rgba(20,50,80,.7); transform: translateY(-2px);">
          <img src="{{ m.img }}" alt="{{ m.name }}" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 14px; display: block; margin-bottom: 14px;">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 18px; color: #16324a;">{{ m.name }}</div>
          <div style="font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: .04em; color: #6a8296; margin-top: 4px;">{{ m.role }}</div>
        </button>
      </sc-for>
    </div>
    </sc-if>
  </div>

  <!-- footer (shared component: site-footer.dc.html) -->
  <dc-import name="site-footer"></dc-import>

  <!-- bio modal -->
  <sc-if value="{{ hasSel }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ close }}" class="modal-overlay" style="position: fixed; inset: 0; z-index: 60; background: rgba(9,26,42,.55); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center;">
      <div onClick="{{ stop }}" class="modal-card" style="background: #fff; border-radius: 24px; max-width: 640px; width: 100%; max-height: 86vh; overflow: auto; box-shadow: 0 50px 100px -40px rgba(10,30,55,.6);">
        <div class="modal-grid" style="align-items: start;">
          <img src="{{ sel.img }}" alt="{{ sel.name }}" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 18px; display: block;">
          <div>
            <div style="display: flex; align-items: start; justify-content: space-between; gap: 12px;">
              <div>
                <span style="font-family: 'Space Mono', monospace; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #0091c7;">{{ sel.role }}</span>
                <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 30px; margin: 8px 0 0; letter-spacing: -.01em;">{{ sel.name }}</h2>
              </div>
              <button onClick="{{ close }}" type="button" style="flex: 0 0 auto; cursor: pointer; background: #eef4f9; border: none; border-radius: 999px; width: 34px; height: 34px; font-size: 18px; color: #33566f; line-height: 1;">×</button>
            </div>
          </div>
        </div>
        {{ sel.bioNode }}
        <sc-if value="{{ selHasLinks }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px;">
            <sc-for list="{{ sel.links }}" as="l" hint-placeholder-count="3">
              <a href="{{ l.href }}" target="_blank" rel="noopener" style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #16324a; padding: 9px 16px; border: 1px solid rgba(57,99,175,.24); border-radius: 999px;">{{ l.label }}</a>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  // Start "Technical support" and "Alumni" collapsed so the page renders faster.
  state = { sel: null, lab: [], comentored: [], alumni: [], pets: [], collapsed: { 'Technical support': true, 'Alumni': true } };

  toggleGroup(label) {
    const c = { ...this.state.collapsed };
    c[label] = !c[label];
    this.setState({ collapsed: c });
  }

  async componentDidMount() {
    try {
      const data = await window.SITE.loadYaml('content/team.yaml');
      const clean = window.SITE.clean;
      const decorate = (arr) => (arr || []).map(m => {
        const full = { ...m, bio: clean(m.bio) };
        full.onClick = () => this.setState({ sel: full });
        return full;
      });
      const pets = (data.pets || []).map(n => ({ name: n, img: `assets/pet-photos/${n.toLowerCase()}.jpg` }));
      this.setState({
        lab: decorate(data.lab),
        comentored: decorate(data.comentored),
        alumni: decorate(data.alumni),
        pets,
      });
    } catch (e) { console.error('Failed to load team content:', e); }
  }

  renderVals() {
    const nav = window.SITE.navItems('team.html');
    const collapsed = this.state.collapsed;
    const caret = (label) => collapsed[label] ? '▸' : '▾';
    const mkGroup = (label, members) => ({
      label, members,
      open: !collapsed[label],
      caret: caret(label),
      toggle: () => this.toggleGroup(label),
    });
    const groups = [
      mkGroup('Lab', this.state.lab),
      mkGroup('Co-mentored', this.state.comentored),
    ];
    const sel = this.state.sel;
    const bioNode = sel ? React.createElement('p', {
      style: { fontSize: '16px', lineHeight: '1.65', color: '#43617a', margin: '22px 0 0' },
      dangerouslySetInnerHTML: { __html: sel.bio },
    }) : null;
    return {
      nav, groups, pets: this.state.pets, alumni: this.state.alumni,
      petsOpen: !collapsed['Technical support'],
      petsCaret: caret('Technical support'),
      petsToggle: () => this.toggleGroup('Technical support'),
      alumniOpen: !collapsed['Alumni'],
      alumniCaret: caret('Alumni'),
      alumniToggle: () => this.toggleGroup('Alumni'),
      sel: sel ? { ...sel, bioNode } : {},
      hasSel: !!sel,
      selHasLinks: !!(sel && sel.links && sel.links.length),
      close: () => this.setState({ sel: null }),
      stop: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
