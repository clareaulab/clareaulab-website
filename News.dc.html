<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lareau Lab | News</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<script src="./support.js"></script>
<script src="./site.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Hanken+Grotesk:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; background: linear-gradient(180deg, #eafff5 0%, #e6f9ff 40%, #f4fbff 100%); font-family: 'Hanken Grotesk', system-ui, sans-serif; color: #0f2a3f; -webkit-font-smoothing: antialiased; }
  a { text-decoration: none; color: inherit; }
</style>
</helmet>

<div style="min-height: 100vh;">

  <!-- nav -->
  <div style="position: sticky; top: 0; z-index: 20; backdrop-filter: blur(12px); background: rgba(244,251,255,.72); border-bottom: 1px solid rgba(57,99,175,.12);">
    <div class="nav-inner" style="max-width: 1120px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 20px 32px;">
      <a href="Home.dc.html"><img src="assets/logo.svg" alt="Lareau Lab" style="height: 30px; width: auto;"></a>
      <label class="nav-toggle" aria-label="Toggle menu"><input type="checkbox" class="nav-toggle-cb"></label>
      <nav class="nav-links">
        <sc-for list="{{ nav }}" as="item" hint-placeholder-count="6">
          <a href="{{ item.href }}" style="{{ item.style }}">{{ item.label }}</a>
        </sc-for>
      </nav>
    </div>
  </div>

  <!-- page header -->
  <div class="page-head" style="max-width: 1120px; margin: 0 auto; padding-bottom: 40px;">
    <span style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: #0091c7;">Lab notebook</span>
    <h1 class="page-title" style="font-family: 'Space Grotesk', sans-serif; font-weight: 400; line-height: 1.02; letter-spacing: -.02em; margin: 18px 0 16px;">News</h1>
    <p style="font-size: 19px; line-height: 1.55; color: #33566f; max-width: 620px; margin: 0;">Papers, grants, new faces, and the occasional 100-mile run — everything the lab has been up to since we opened in New York.</p>
  </div>

  <!-- years -->
  <div style="max-width: 1120px; margin: 0 auto; padding: 8px 32px 120px;">
    <sc-for list="{{ years }}" as="yr" hint-placeholder-count="4">
      <section class="news-grid" style="padding: 40px 0; border-top: 1px solid rgba(57,99,175,.16);">
        <div class="news-year">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 42px; color: #0f2a3f; line-height: 1;">{{ yr.year }}</div>
          <div style="font-family: 'Space Mono', monospace; font-size: 12px; color: #6a8296; margin-top: 8px;">{{ yr.count }}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <sc-for list="{{ yr.posts }}" as="p" hint-placeholder-count="6">
            <article style="background: rgba(255,255,255,.62); border: 1px solid rgba(57,99,175,.14); border-radius: 20px; padding: 24px 26px;">
              <div style="font-family: 'Space Mono', monospace; font-size: 12px; letter-spacing: .06em; color: #0091c7; margin-bottom: 10px;">{{ p.date }}</div>
              <h2 style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: 23px; line-height: 1.2; margin: 0 0 12px; color: #16324a;">{{ p.title }}</h2>
              {{ p.body }}
            </article>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>

  <!-- footer (shared component: site-footer.dc.html) -->
  <dc-import name="site-footer"></dc-import>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { posts: [] };

  async componentDidMount() {
    try {
      const data = await window.SITE.loadYaml('content/news.yaml');
      this.setState({ posts: data || [] });
    } catch (e) { console.error('Failed to load news content:', e); }
  }

  renderVals() {
    const nav = window.SITE.navItems('News.dc.html');
    const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const posts = (this.state.posts || []).map(item => {
      const d = item.date;
      const [y, m] = d.split('-');
      return {
        d, year: y, sortKey: d,
        date: months[parseInt(m, 10) - 1] + ' ' + y,
        title: item.title,
        body: React.createElement('div', {
          style: { fontSize: '16px', lineHeight: '1.6', color: '#43617a' },
          dangerouslySetInnerHTML: { __html: window.SITE.md(item.body) },
        }),
      };
    }).sort((a, b) => b.sortKey.localeCompare(a.sortKey));

    const byYear = {};
    posts.forEach(p => { (byYear[p.year] = byYear[p.year] || []).push(p); });
    const years = Object.keys(byYear).sort((a, b) => b.localeCompare(a)).map(y => ({
      year: y,
      posts: byYear[y],
      count: byYear[y].length + (byYear[y].length === 1 ? ' update' : ' updates'),
    }));

    return { nav, years };
  }
}
</script>
</body>
</html>
